<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채널 데이터 대시보드</title>
<meta name="description" content="Raw_data.xlsx를 데이터 소스로 Channel → 필터 → 테이블 → 막대그래프 순으로 탐색하는 대시보드">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="title">
      <h1>채널 데이터 대시보드</h1>
      <p class="source">데이터 소스: <b id="sourceName">불러오는 중…</b></p>
    </div>
    <label class="btn ghost" for="fileInput">다른 엑셀 파일 열기</label>
    <input type="file" id="fileInput" accept=".xlsx,.xlsm,.xls" hidden>
  </header>

  <!-- 1. Channel -->
  <section class="panel">
    <div class="panel-label">Channel</div>
    <nav id="channelTabs" class="tabs" role="tablist" aria-label="Channel"></nav>
  </section>

  <!-- 2. Filters -->
  <section class="panel">
    <div class="panel-head">
      <div class="panel-label">필터</div>
      <button type="button" id="resetFilters" class="btn link">필터 초기화</button>
    </div>
    <div id="filters" class="filters"></div>
  </section>

  <div id="context" class="context" aria-live="polite"></div>

  <!-- 3. Table -->
  <section class="panel">
    <div class="panel-head">
      <div class="panel-label" id="tableTitle">데이터 테이블</div>
      <div id="viewToggle" class="seg" hidden>
        <button type="button" data-view="long" class="on">정리된 표</button>
        <button type="button" data-view="sheet">시트 레이아웃</button>
      </div>
    </div>
    <div id="tableWrap" class="table-wrap"></div>
  </section>

  <!-- 4. Charts -->
  <section class="panel">
    <div class="panel-head">
      <div class="panel-label" id="chartTitle">그래프</div>
    </div>
    <div id="charts" class="charts"></div>
  </section>

  <div id="dropzone" class="dropzone" hidden>
    <div class="dz-box">
      <h2>엑셀 파일을 선택하세요</h2>
      <p><code>Raw_data.xlsx</code>를 선택하거나 이 창에 끌어다 놓으세요.<br>파일은 서버로 전송되지 않고 브라우저 안에서만 읽힙니다.</p>
      <label class="btn" for="fileInput">엑셀 파일 선택</label>
      <p class="dz-err" id="dzErr"></p>
    </div>
  </div>
</div>
<div id="tooltip" class="tooltip" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채널 데이터 대시보드</title>
<meta name="description" content="Raw_data.xlsx를 데이터 소스로 Channel → 필터 → 테이블 → 막대그래프 순으로 탐색하는 대시보드">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="page">
  <!-- 1. Channel · 2. Filters -->
  <section class="panel controls">
    <div class="corner">
      <button type="button" id="resetFilters" class="icon-btn" title="필터 초기화" aria-label="필터 초기화">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
      </button>
      <label class="icon-btn" for="fileInput" id="fileBtn" title="다른 엑셀 파일 열기" aria-label="다른 엑셀 파일 열기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
      </label>
      <input type="file" id="fileInput" accept=".xlsx,.xlsm,.xls" hidden>
    </div>
    <div class="crow">
      <span class="clabel">Channel</span>
      <nav id="channelTabs" class="tabs" role="tablist" aria-label="Channel"></nav>
    </div>
    <div class="crow">
      <span class="clabel">Filter</span>
      <div id="filters" class="filters"></div>
    </div>
  </section>

  <div id="context" class="context" aria-live="polite"></div>

  <!-- 3. Table -->
  <section class="panel">
    <div class="panel-head">
      <div class="panel-label" id="tableTitle">데이터 테이블</div>
    </div>
    <div id="tableWrap" class="table-wrap"></div>
  </section>

  <!-- 4. Charts (RAW Data 채널에서는 숨김) -->
  <section class="panel" id="chartSection">
    <div class="panel-head">
      <div class="panel-label" id="chartTitle">그래프</div>
    </div>
    <div id="charts" class="charts"></div>
  </section>

  <div id="dropzone" class="dropzone" hidden>
    <div class="dz-box">
      <h2>엑셀 파일을 선택하세요</h2>
      <p><code>Raw_data.xlsx</code>를 선택하거나 이 창에 끌어다 놓으세요.<br>파일은 서버로 전송되지 않고 브라우저 안에서만 읽힙니다.</p>
      <label class="btn" for="fileInput">엑셀 파일 선택</label>
      <p class="dz-err" id="dzErr"></p>
    </div>
  </div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aa2ff"/>
      <stop offset="100%" stop-color="#4f6bff"/>
    </linearGradient>
  </defs>
</svg>
<div id="tooltip" class="tooltip" role="status" hidden></div>
<script src="data.js" onerror="this.remove()"></script>
<script src="app.js"></script>
</body>
</html>

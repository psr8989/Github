<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTURE BOARD · 라이브 배경 & 날씨</title>
<style>
  :root {
    --neon: #7cc8ff;
    --text: #eef6ff;
    --muted: #b6c6dc;
    --panel: rgba(10, 18, 34, 0.40);
    --panel-border: rgba(150, 200, 255, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Malgun Gothic", -apple-system, sans-serif;
    color: var(--text);
    background: #05080f;
  }

  /* === 배경: 차분한 빗줄기 (캔버스) === */
  #bg {
    position: fixed; inset: 0; z-index: 0; display: block;
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #0b1528 0%, #070c18 55%, #04060d 100%);
  }
  /* 위젯 가독성을 위한 모서리 스크림 */
  .scrim {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(560px 280px at 0% 0%, rgba(0,0,0,0.45), transparent 70%),
      radial-gradient(720px 280px at 100% 0%, rgba(0,0,0,0.42), transparent 72%),
      linear-gradient(180deg, rgba(4,8,16,0.30), transparent 16%);
  }

  /* === HUD (위젯) === */
  .hud { position: fixed; top: 18px; z-index: 2; }
  .hud-left { left: 22px; }
  .hud-right { right: 22px; }

  /* 시계 / 날짜 */
  .clock {
    font-size: clamp(1.4rem, 2.6vw, 1.95rem);
    font-weight: 300; letter-spacing: 0.03em; line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 12px rgba(0,0,0,0.55);
  }
  .clock .sec { color: var(--neon); font-size: 0.45em; vertical-align: super; margin-left: 0.12em; }
  .date {
    margin-top: 4px; font-size: 0.78rem; color: var(--muted);
    letter-spacing: 0.08em; text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }

  /* 현재 날씨 패널 */
  .now {
    margin-top: 10px;
    display: inline-flex; align-items: center; gap: 14px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 10px 16px;
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    box-shadow: 0 6px 26px rgba(0,0,0,0.35);
  }
  .now .ico { font-size: 2.1rem; filter: drop-shadow(0 0 8px rgba(124,200,255,0.35)); }
  .now .temp { font-size: 1.9rem; font-weight: 300; line-height: 1; }
  .now .temp sup { font-size: 0.42em; color: var(--muted); }
  .now .desc { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
  .now .meta { font-size: 0.72rem; color: var(--muted); line-height: 1.55; }
  .now .meta b { color: var(--text); font-weight: 600; }

  /* 자외선 색상 단계 */
  .uv { font-weight: 700; }
  .uv-low    { color: #6ee7a8; }
  .uv-mod    { color: #fde047; }
  .uv-high   { color: #fdba74; }
  .uv-vhigh  { color: #fca5a5; }
  .uv-extreme{ color: #d8b4fe; }

  /* 주간 예보 (우측 상단, 작은 스트립) */
  .week {
    display: flex; gap: 6px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 9px 11px;
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    box-shadow: 0 6px 26px rgba(0,0,0,0.35);
  }
  .day {
    width: 50px; text-align: center;
    padding: 2px 0; border-radius: 9px;
    transition: background 0.2s ease;
  }
  .day.today { background: rgba(124,200,255,0.14); }
  .day .dname { font-size: 0.62rem; color: var(--muted); letter-spacing: 0.04em; }
  .day .dico { font-size: 1.25rem; margin: 1px 0; line-height: 1; }
  .day .dmax { font-size: 0.78rem; font-weight: 700; }
  .day .dmin { font-size: 0.66rem; color: var(--muted); }
  .day .dpop { font-size: 0.6rem; color: var(--neon); font-weight: 600; margin-top: 1px; }
  .day .duv  { font-size: 0.58rem; margin-top: 1px; }

  @media (max-width: 760px) {
    .day { width: 38px; }
    .day .dpop, .day .duv { display: none; }
  }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="scrim"></div>

  <!-- 좌측 상단: 시계 + 현재 날씨 -->
  <div class="hud hud-left">
    <div class="clock" id="clock">--:--<span class="sec">--</span></div>
    <div class="date" id="date">로딩 중…</div>
    <div class="now" id="now">
      <div class="ico" id="nowIco">⏳</div>
      <div>
        <div class="temp" id="nowTemp">--<sup>°C</sup></div>
        <div class="desc" id="nowDesc">날씨 불러오는 중…</div>
      </div>
      <div class="meta" id="nowMeta"></div>
    </div>
  </div>

  <!-- 우측 상단: 주간 예보 -->
  <div class="hud hud-right">
    <div class="week" id="week"></div>
  </div>

<script>
/* =========================================================
   배경: 차분한 빗줄기 (Lively "Rain" 느낌, 캔버스)
   ========================================================= */
(function () {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let w, h, dpr, layers;

  // 원근 2.5겹: 멀수록 가늘고 흐리고 느림
  const DEF = [
    { density: 9000, len: [10, 18], width: 0.8, speed: [4, 6],   alpha: [0.05, 0.12] },
    { density: 7000, len: [16, 30], width: 1.2, speed: [7, 10],  alpha: [0.10, 0.20] },
    { density: 9000, len: [26, 46], width: 1.6, speed: [11, 15], alpha: [0.16, 0.30] }
  ];
  const SWAY = 1.6; // 바람에 비스듬히 기우는 정도

  const rand = (a, b) => a + Math.random() * (b - a);

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.width = innerWidth * dpr;
    h = canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    layers = DEF.map(def => {
      const count = Math.floor((innerWidth * innerHeight) / def.density);
      const drops = [];
      for (let i = 0; i < count; i++) drops.push(newDrop(def, true));
      return { def, drops };
    });
  }

  function newDrop(def, spread) {
    return {
      x: Math.random() * (w + 140 * dpr) - 70 * dpr,
      y: spread ? Math.random() * h : -rand(20, 120) * dpr,
      len: rand(def.len[0], def.len[1]) * dpr,
      speed: rand(def.speed[0], def.speed[1]) * dpr,
      alpha: rand(def.alpha[0], def.alpha[1])
    };
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    ctx.lineCap = 'round';
    const sway = SWAY * dpr;
    for (const layer of layers) {
      const wdt = layer.def.width * dpr;
      for (const d of layer.drops) {
        const tailX = d.x - sway;
        const grad = ctx.createLinearGradient(d.x, d.y, tailX, d.y + d.len);
        grad.addColorStop(0, `rgba(200,224,255,${d.alpha})`);
        grad.addColorStop(1, 'rgba(170,205,255,0)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = wdt;
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(tailX, d.y + d.len);
        ctx.stroke();

        d.y += d.speed;
        d.x -= sway * 0.12;
        if (d.y > h) Object.assign(d, newDrop(layer.def, false));
      }
    }
    requestAnimationFrame(draw);
  }

  addEventListener('resize', resize);
  resize();
  draw();
})();

/* =========================================================
   시계 / 날짜
   ========================================================= */
(function () {
  const elClock = document.getElementById('clock');
  const elDate = document.getElementById('date');
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  function tick() {
    const d = new Date();
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    const ss = String(d.getSeconds()).padStart(2, '0');
    elClock.innerHTML = `${hh}:${mm}<span class="sec">${ss}</span>`;
    elDate.textContent = `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()} (${days[d.getDay()]})`;
    requestAnimationFrame(() => setTimeout(tick, 250));
  }
  tick();
})();

/* =========================================================
   날씨 (Open-Meteo · API 키 불필요 · 현재 위치 기준)
   ========================================================= */
(function () {
  const WMO = {
    0:  ['☀️', '맑음'],          1: ['🌤️', '대체로 맑음'], 2: ['⛅', '구름 조금'],
    3:  ['☁️', '흐림'],          45:['🌫️', '안개'],        48:['🌫️', '서리 안개'],
    51:['🌦️', '약한 이슬비'],    53:['🌦️', '이슬비'],      55:['🌧️', '짙은 이슬비'],
    61:['🌧️', '약한 비'],        63:['🌧️', '비'],          65:['🌧️', '강한 비'],
    66:['🌧️', '얼어붙는 비'],    67:['🌧️', '강한 어는비'],
    71:['🌨️', '약한 눈'],        73:['❄️', '눈'],           75:['❄️', '강한 눈'],
    77:['🌨️', '싸락눈'],
    80:['🌦️', '약한 소나기'],    81:['🌧️', '소나기'],      82:['⛈️', '강한 소나기'],
    85:['🌨️', '소낙눈'],         86:['❄️', '강한 소낙눈'],
    95:['⛈️', '천둥번개'],        96:['⛈️', '뇌우·우박'],    99:['⛈️', '강한 뇌우']
  };
  const dayNames = ['일', '월', '화', '수', '목', '금', '토'];

  function uvClass(uv) {
    if (uv == null) return ['uv-mod', '—'];
    if (uv < 3)  return ['uv-low', '낮음'];
    if (uv < 6)  return ['uv-mod', '보통'];
    if (uv < 8)  return ['uv-high', '높음'];
    if (uv < 11) return ['uv-vhigh', '매우높음'];
    return ['uv-extreme', '위험'];
  }
  const wmo = (c) => WMO[c] || ['❓', '알 수 없음'];

  async function fetchWeather(lat, lon) {
    const url = `https://api.open-meteo.com/v1/forecast`
      + `?latitude=${lat}&longitude=${lon}`
      + `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,uv_index`
      + `&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max,precipitation_probability_max`
      + `&timezone=auto&forecast_days=7`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('weather fetch failed');
    render(await res.json());
  }

  function render(data) {
    const c = data.current;
    const [ico, desc] = wmo(c.weather_code);
    document.getElementById('nowIco').textContent = ico;
    document.getElementById('nowTemp').innerHTML = `${Math.round(c.temperature_2m)}<sup>°C</sup>`;
    document.getElementById('nowDesc').textContent = desc;

    const [ucls, utxt] = uvClass(c.uv_index);
    document.getElementById('nowMeta').innerHTML =
      `체감 <b>${Math.round(c.apparent_temperature)}°</b>　습도 <b>${c.relative_humidity_2m}%</b><br>`
      + `바람 <b>${Math.round(c.wind_speed_10m)}km/h</b><br>`
      + `자외선 <span class="uv ${ucls}">${(c.uv_index ?? 0).toFixed(1)} · ${utxt}</span>`;

    const wk = document.getElementById('week');
    wk.innerHTML = '';
    const d = data.daily;
    const todayStr = new Date().toISOString().slice(0, 10);
    d.time.forEach((iso, i) => {
      const dt = new Date(iso + 'T00:00');
      const [dico] = wmo(d.weather_code[i]);
      const [ducls] = uvClass(d.uv_index_max[i]);
      const isToday = iso === todayStr;
      const pop = d.precipitation_probability_max ? d.precipitation_probability_max[i] : null;
      const cell = document.createElement('div');
      cell.className = 'day' + (isToday ? ' today' : '');
      cell.innerHTML =
        `<div class="dname">${isToday ? '오늘' : dayNames[dt.getDay()]}</div>`
        + `<div class="dico">${dico}</div>`
        + `<div class="dmax">${Math.round(d.temperature_2m_max[i])}°</div>`
        + `<div class="dmin">${Math.round(d.temperature_2m_min[i])}°</div>`
        + `<div class="dpop">💧${pop == null ? '-' : pop}%</div>`
        + `<div class="duv"><span class="uv ${ducls}">UV ${Math.round(d.uv_index_max[i])}</span></div>`;
      wk.appendChild(cell);
    });
  }

  // 현재 위치 기준. 권한 거부/미지원 시 조용히 서울로 폴백.
  function start() {
    const seoul = () => fetchWeather(37.566, 126.978).catch(() => {});
    if (!navigator.geolocation) { seoul(); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => fetchWeather(pos.coords.latitude.toFixed(3), pos.coords.longitude.toFixed(3)).catch(seoul),
      seoul,
      { timeout: 8000, enableHighAccuracy: false }
    );
  }
  start();
})();
</script>
</body>
</html>

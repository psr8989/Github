<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대시보드 모음 · psr8989</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-hover: #222632;
    --border: #2a2f3a;
    --text: #e8eaed;
    --muted: #9aa0ac;
    --accent: #d4af37;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4rem 1.25rem;
  }
  header { text-align: center; margin-bottom: 3rem; max-width: 640px; }
  h1 { font-size: 2.25rem; letter-spacing: -0.02em; margin-bottom: 0.75rem; }
  h1 .dot { color: var(--accent); }
  header p { color: var(--muted); font-size: 1.05rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.25rem;
    width: 100%;
    max-width: 960px;
  }
  .card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.75rem;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    background: var(--card-hover);
    border-color: var(--accent);
  }
  .card .ico { font-size: 2rem; margin-bottom: 0.85rem; }
  .card h2 { font-size: 1.2rem; margin-bottom: 0.5rem; }
  .card .go {
    margin-top: 1.1rem;
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 600;
  }
  footer { margin-top: 3.5rem; color: var(--muted); font-size: 0.82rem; text-align: center; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>📊 대시보드 모음<span class="dot">.</span></h1>
    <p>데이터 분석 · 머신러닝 · 인터랙티브 웹 프로젝트 모음</p>
  </header>

  <main class="grid">
    <a class="card" href="dashboards/calendar-task/index.html">
      <div class="ico">🗓️</div>
      <h2>달력 할 일 (CalendarTask)</h2>
      <div class="go">바로가기 →</div>
    </a>

    <a class="card" href="dashboards/futuristic-wallpaper/index.html">
      <div class="ico">🌌</div>
      <h2>미래형 라이브 배경 & 날씨</h2>
      <div class="go">바로가기 →</div>
    </a>

    <a class="card" href="dashboards/campaign-dashboard/index.html">
      <div class="ico">📊</div>
      <h2>캠페인 반응 예측 ML 대시보드</h2>
      <div class="go">바로가기 →</div>
    </a>

    <a class="card" href="dashboards/3d-calculator/index.html">
      <div class="ico">🧮</div>
      <h2>3D 계산기</h2>
      <div class="go">바로가기 →</div>
    </a>

    <a class="card" href="dashboards/dunwich-campaign/index.html">
      <div class="ico">🕯️</div>
      <h2>던위치의 유산 캠페인 안내서</h2>
      <div class="go">바로가기 →</div>
    </a>
  </main>

  <footer>
    <a href="https://github.com/psr8989/Github" target="_blank" rel="noopener">github.com/psr8989/Github</a>
  </footer>
</body>
</html>
